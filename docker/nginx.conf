server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Module Federation remotes are loaded cross-origin (different ports),
    # so every asset must be served with permissive CORS headers.
    location / {
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        try_files $uri $uri/ /index.html;
    }

    # Ensure the federated remoteEntry and ESM chunks are served as JavaScript
    # modules with CORS headers so the shell can import them.
    location ~ \.mjs$ {
        default_type text/javascript;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
