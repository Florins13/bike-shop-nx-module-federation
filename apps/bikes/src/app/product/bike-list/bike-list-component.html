<main style="padding: 20px;">
  <div style="margin-bottom: 10px;">
    <span class="p-float-label">
      <input
        id="search"
        pInputText
        [(ngModel)]="searchTerm"
        placeholder="Search bikes..."
      />
      <label for="search">Search</label>
    </span>
  </div>

  <div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: space-evenly;">
    @for (bike of filteredBikes(); track bike.id) {
      <p-card [header]="bike.model" [style]="{ width: '250px' }">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <img [src]="bike.imageSource" height="70" width="70" [alt]="bike.model">
          <p-tag [value]="bike.price + '€'" severity="info" />
          <span>Stock: {{ bike.availableStock }}</span>
          <span>{{ bike.details }}</span>
          @if (bike.electric) {
            <p-tag value="Electric" icon="pi pi-bolt" severity="success" />
          }
        </div>

        <ng-template #footer>
          @if (role === 'BASIC') {
            <p-button
              label="Add to cart"
              icon="pi pi-shopping-cart"
              (onClick)="addToCart(bike)"
              [disabled]="bike.availableStock <= 0"
              size="small"
            />
          }

          @if (role === 'MANAGER') {
            <div style="display: flex; gap: 10px;">
              <p-button label="Edit" icon="pi pi-pencil" severity="secondary" size="small" (onClick)="editBike(bike)" />
              <p-button label="Delete" icon="pi pi-trash" severity="danger" size="small" (onClick)="deleteBike(bike)" />
            </div>
          }
        </ng-template>
      </p-card>
    }
  </div>
</main>
